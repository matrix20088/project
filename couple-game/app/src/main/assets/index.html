<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1020">
<title>الهروب سوا</title>
<style>
:root{color-scheme:dark;--surface:#171b35;--pink:#ff658d;--cyan:#39e7e3;--yellow:#ffcf6e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#29224d 0%,#10152d 45%,#090d1d 100%);color:#fff;font:500 16px system-ui,'Noto Sans Arabic',sans-serif;min-height:100dvh;overflow-x:hidden}
body:before{content:'';pointer-events:none;position:fixed;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(#0005,transparent 90%)}
button,input{font:inherit}button{cursor:pointer}#app{position:relative;min-height:100dvh;max-width:520px;margin:auto;padding:24px 19px 35px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--cyan);font-weight:900}.logo{font-size:23px;font-weight:1000;letter-spacing:-1px}
.pill{border:1px solid #3c435f;padding:7px 10px;border-radius:999px;font-size:12px;color:#cbd4ee;background:#1a2038}
.hero{text-align:center;padding:32px 4px 24px}
.orb{width:152px;height:152px;border-radius:50%;margin:0 auto 23px;display:grid;place-items:center;font-size:66px;background:radial-gradient(circle at 30% 24%,#fa84a4,#9137a9 55%,#2e2a76 90%);box-shadow:0 0 0 10px #e667a514,0 0 0 24px #e667a50c,0 25px 75px #fc467a55;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}h1{font-size:37px;line-height:1.22;margin:0;font-weight:1000;letter-spacing:-1.5px}h2{font-size:27px;line-height:1.45;margin:8px 0;font-weight:900}
.desc{color:#acb9d4;line-height:1.8;font-size:15px}.accent{color:var(--pink)}.cyan{color:var(--cyan)}
.panel{background:linear-gradient(135deg,#212747eb,#171b35eb);border:1px solid #393c60;border-radius:24px;padding:20px;box-shadow:0 12px 42px #0003;margin-top:17px}
.btn{display:block;width:100%;border:0;border-radius:16px;min-height:57px;padding:13px 16px;color:#14182b;background:linear-gradient(110deg,#ff789e,#ff9c75);font-weight:900;font-size:16px;margin-top:11px;box-shadow:0 9px 24px #ff5d8930}
.btn.alt{color:#e9f9ff;background:#252b49;border:1px solid #465274;box-shadow:none}.btn.cyanbg{background:linear-gradient(110deg,#38e7dc,#80d9ff);color:#042631}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.48}
.note{font-size:12px;color:#93a2bf;line-height:1.8;text-align:center;margin-top:14px}
.device{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:right;border:1px solid #3e5277;background:#232945;color:#fff;padding:15px 13px;border-radius:14px;margin:10px 0}
.device strong{display:block}.device small{display:block;color:#8394b3;font-size:11px;direction:ltr;text-align:right}
.spinner{display:block;width:46px;height:46px;border:3px solid #37dedb40;border-top-color:#37dedb;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;align-items:center;justify-content:space-between;margin:21px 0 12px;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:7px;border-radius:14px;background:#232b49;border:1px solid #405077;padding:9px 13px;font-size:13px}.chip b{color:var(--yellow)}
.timer{font-size:30px;font-weight:1000;color:var(--cyan);font-variant-numeric:tabular-nums}.timer.danger{color:var(--pink);animation:blink .7s infinite}@keyframes blink{50%{opacity:.58}}
.track{height:7px;border-radius:20px;background:#28314f;overflow:hidden;margin-top:11px}.fill{height:100%;background:linear-gradient(90deg,#ff6f92,#56e4e0);border-radius:20px;transition:width .4s}
.step{font-size:11px;color:#8bdadb;letter-spacing:1px;font-weight:900}.missiontitle{font-size:29px;font-weight:950;line-height:1.35;margin:12px 0}
.role{padding:16px 17px;border:1px solid #3c5274;border-radius:18px;background:#17223a;margin:16px 0}.role .rolelabel{font-size:11px;color:var(--cyan);font-weight:850}.role strong{display:block;margin:3px 0 6px;font-size:19px}.role p{margin:0;color:#a9b8d3;font-size:14px;line-height:1.85}
.route{display:flex;flex-direction:row;gap:8px;justify-content:center;flex-wrap:wrap;margin:19px 0 13px}.route .dot{width:27px;height:27px;border-radius:10px;display:grid;place-items:center;background:#2b3150;border:1px solid #515b7e;color:#b8c8df;font-size:12px}.route .dot.done{background:#18a9a0;border-color:#26c6ba;color:#fff}.route .dot.current{background:#ff678b;border-color:#ff9cba;color:#fff;box-shadow:0 0 0 5px #ff6f8e24}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.door{padding:22px 4px;border-radius:20px;border:1px solid #455b83;background:linear-gradient(180deg,#2a3354,#171d38);color:#e5f8ff;min-height:144px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:14px;font-weight:900}.door .symbol{font-size:40px}.door:active{background:#365269}
.scan{display:flex;justify-content:space-around;gap:8px;margin:17px auto;border:1px solid #344b6e;background:#0d1e34;padding:18px 6px;border-radius:21px}.signal{width:29%;font-size:45px;text-align:center;padding:7px 0;filter:drop-shadow(0 0 14px #32d7e777);animation:float 2s ease-in-out infinite}
.keypad{display:flex;gap:9px;justify-content:center;margin:21px 0;direction:ltr}.digit{width:23%;height:70px;display:grid;place-items:center;background:#0f1f36;border:1px solid #3c607c;border-radius:14px;font-size:30px;font-weight:900;color:#45f1e7}.digit.hidden{color:#60718d;border-style:dashed}
.codeInput{display:block;width:100%;border:1px solid #627da6;border-radius:17px;background:#101e35;color:#fff;letter-spacing:14px;text-align:center;font-size:30px;padding:13px;direction:ltr;outline:none}.codeInput:focus{border-color:var(--cyan)}
.bigTap{border:2px solid #ff90ae;background:radial-gradient(circle at 45% 35%,#ff9dbe,#ff527a 55%,#992a60 100%);border-radius:50%;width:190px;height:190px;display:block;margin:20px auto;color:#fff;font-size:20px;font-weight:1000;box-shadow:0 0 0 10px #f470a11c,0 0 0 25px #f470a110,0 17px 38px #ff5b8780;animation:pulse 1.5s infinite}.bigTap.armed{background:radial-gradient(circle,#60ffee,#179eaa);border-color:#bafff0}
@keyframes pulse{50%{box-shadow:0 0 0 17px #f470a113,0 0 0 35px #f470a108,0 17px 38px #ff5b8780}}
.alert{color:var(--yellow);background:#54451e3a;border:1px solid #706039;border-radius:16px;padding:12px 13px;font-size:14px;margin:16px 0;line-height:1.65;min-height:51px}.success{color:#50efc9;background:#145f5444;border-color:#237b73}.failure{color:#ff91af;background:#69203c44;border-color:#96496e}
.center{text-align:center}.bigScore{font-size:64px;color:var(--yellow);font-weight:1000;line-height:1.3}.confetti{font-size:57px;letter-spacing:10px;animation:float 2s infinite}.footer{font-size:11px;color:#657899;text-align:center;margin-top:28px}.tagline{font-size:11px;letter-spacing:1px;color:#e3a8c5;font-weight:900;text-align:center}p{margin-top:7px}.how{font-size:14px;color:#a6b5d2;line-height:1.85}.how b{color:#fff}.waiting{padding:48px 8px;text-align:center}

.newhero{padding-top:22px}.newhero .orb{font-size:68px;width:132px;height:132px;margin-bottom:24px}.newhero h1{font-size:32px}
.heatgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.heat{background:#252b49;border:1px solid #485375;border-radius:15px;color:#fff;padding:16px 4px;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:26px;font-weight:800;min-height:92px}.heat span{font-size:12px}.heat.selected{border:2px solid #ff80a8;background:linear-gradient(160deg,#51345d,#332342);box-shadow:0 0 0 4px #ff709512}
.hint{font-size:12px;color:#bcb5d7;line-height:1.7;margin:6px 0 17px}
.sectiontitle{font-size:19px;font-weight:900;display:flex;gap:10px;justify-content:space-between;align-items:center;margin:28px 0 13px}.sectiontitle span{font-size:11px;font-weight:700;color:#a2aed0}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.world{background:linear-gradient(140deg,#262846,#151c36);border:1px solid #3d4769;border-radius:17px;min-height:88px;display:flex;align-items:center;padding:12px;gap:10px;box-shadow:0 9px 22px #0002}
.world.locked{opacity:.45}.world .worldicon{font-size:25px}.world b{display:block;font-size:13px;line-height:1.45}.world small{font-size:10px;color:#93a4c8}.worldstar{margin-inline-start:auto;font-size:16px}
.worldline{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:10px 12px;background:#1b243d;border:1px solid #364e67;border-radius:14px;font-size:12px;gap:6px}.worldline b{color:#72f5e2;white-space:nowrap}.worldline span{color:#c7d0e5}
.stagegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.stageitem{background:#242b48;min-height:65px;border:1px solid #384a69;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:26px;gap:3px}.stageitem small{font-size:10px;color:#9aacc6}.stageitem.current{background:linear-gradient(135deg,#623454,#38244e);border-color:#ed6b99;box-shadow:0 0 0 3px #f2709617}.stageitem.past{background:#1d5957;border-color:#43857c;color:#68f1d6}
.options{display:flex;flex-direction:column;gap:11px;margin-top:19px}.option{background:linear-gradient(120deg,#303551,#1b2644);color:#fff;border:1px solid #52638c;min-height:65px;border-radius:16px;font-weight:800;font-size:15px;text-align:right;padding:14px 16px;display:flex;align-items:center;gap:14px}.option span{font-size:24px;color:#48e5db}.option:active{background:#404366}.option:disabled{opacity:.5}
.arrowgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin:20px 0}.arrowgrid button{height:86px;border:1px solid #4e6f8e;border-radius:19px;background:#293652;color:#fff;font-size:35px}.arrowgrid button:active{background:#42798b}
.energy{height:24px;width:100%;border-radius:99px;background:#28314e;border:1px solid #506586;overflow:hidden;margin:30px auto 14px}.energyfill{height:100%;background:linear-gradient(90deg,#ed527d,#feac69,#61f0d9);transition:width .16s}
.confirmgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.confirmgrid span{padding:13px 4px;border-radius:12px;background:#1b2b42;border:1px solid #405375;text-align:center;font-size:13px}.skip{font-size:13px;min-height:49px;opacity:.87;margin-top:16px}.panel h2{overflow-wrap:break-word}.role p{overflow-wrap:break-word}
#app{padding-bottom:max(40px,env(safe-area-inset-bottom))}@media(max-width:375px){#app{padding-left:13px;padding-right:13px}.worlds{gap:7px}.world{padding:9px;gap:5px}.world b{font-size:12px}.heat span{font-size:11px}.chip{font-size:11px;padding:7px}.timer{font-size:24px}.missiontitle{font-size:25px}}
</style>
</head>
<body><main id="app"></main>
<script src="game.js"></script></body></html>
