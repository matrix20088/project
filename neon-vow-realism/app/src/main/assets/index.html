<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON VOW — Real 3D Material Test</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#071023;color:white;font-family:system-ui,sans-serif;width:100%;height:100%;overflow:hidden}
#game{position:fixed;inset:0}canvas{display:block;outline:0}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:15px;left:25px;right:25px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-size:30px;letter-spacing:3px;font-weight:1000;text-shadow:0 2px 12px #040917}
.title span{color:#ff68b7}
.caption{font-size:11px;letter-spacing:2px;color:#b4d7e7;font-weight:700}
.pill{background:#071629bf;border:1px solid #77e6f4b0;padding:9px 14px;border-radius:12px;font-size:12px;font-weight:800}
.bottom{position:absolute;bottom:22px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:end;gap:12px}
.buttons{display:flex;gap:12px;align-items:center}
.pad{height:138px;width:138px;background:#09203999;border:2px solid #8cedff70;border-radius:50%;display:grid;place-items:center;font-size:52px;color:#9bf9ff;pointer-events:auto;user-select:none;touch-action:none}
.btn{height:90px;width:90px;border-radius:50%;display:grid;place-items:center;color:white;font-size:18px;font-weight:900;pointer-events:auto;user-select:none;touch-action:none;cursor:pointer}
.btn.attack{background:#c33d91c9;border:3px solid #ff93d4}
.btn.dash{background:#21719bc9;border:3px solid #7bf5ff}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#090e21ea;border:2px solid #59deff;padding:14px 20px;border-radius:16px;font-size:15px;font-weight:900;white-space:nowrap}
.legal{position:absolute;top:60px;left:25px;color:#9ec0c5;font-size:10px;letter-spacing:1.3px}
@media(max-height:480px){.title{font-size:24px}.pad{width:106px;height:106px}.btn{width:75px;height:75px;font-size:15px}.bottom{bottom:12px}}
</style></head>
<body><div id="game"></div>
<div id="hud">
<div class="top"><div><div class="title">NEON <span>VOW</span></div><div class="caption">REALISTIC 3D VISUAL PROTOTYPE</div></div><div class="pill">P1 &amp; P2 • THIRD-PERSON TEST</div></div>
<div class="legal">RENDER TEST • NOT FINAL GAME ART</div>
<div id="loading">جاري تحميل الشخصيات الحقيقية 0/2</div>
<div class="bottom">
 <div id="control" class="pad">✣</div>
 <div class="buttons"><div id="dash" class="btn dash">اندفاع</div><div id="attack" class="btn attack">هجوم</div></div>
</div></div><script src="game.js"></script></body></html>
