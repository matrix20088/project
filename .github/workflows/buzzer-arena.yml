name: Build Men Demaghak Android
on:
  push:
    branches: [buzzer-arena-2026]
    paths:
      - 'buzzer-arena/**'
      - '.github/workflows/buzzer-arena.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fair turn-based game and ten-point winner
        run: node buzzer-arena/tests/turn_mode.test.cjs
      - name: Verify one-time onboarding walkthrough
        run: |
          node --check buzzer-arena/app/src/main/assets/onboarding.js
          node buzzer-arena/tests/onboarding.test.cjs
      - name: Validate backend syntax and room logic
        run: |
          node --check buzzer-arena/online-server/api/room.js
          node --check buzzer-arena/online-server/api/cleanup.js
      - name: Bundle real flag SVG pictures for offline Android play (flag-icons MIT)
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v7.3.2 https://github.com/lipis/flag-icons.git /tmp/buzzer-flag-icons
          mkdir -p buzzer-arena/app/src/main/assets/flags
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),path=require('path');
          const dir='buzzer-arena/app/src/main/assets';
          const ctx={};vm.createContext(ctx);
          for(const f of ['questions.js','extra_questions.js','hard_questions.js','movie_music_levels.js','flag_questions.js']){
            vm.runInContext(fs.readFileSync(path.join(dir,f),'utf8'),ctx,{filename:f});
          }
          const codes=[...new Set(vm.runInContext('Object.values(FLAG_QUESTION_IMAGES)',ctx))];
          for(const code of codes){
            if(!/^[a-z]{2}$/.test(code))throw Error('Invalid flag code: '+code);
            const src=path.join('/tmp/buzzer-flag-icons/flags/4x3',code+'.svg');
            if(!fs.existsSync(src))throw Error('Missing upstream flag '+src);
            fs.copyFileSync(src,path.join(dir,'flags',code+'.svg'));
          }
          fs.copyFileSync('/tmp/buzzer-flag-icons/LICENSE',path.join(dir,'flags','LICENSE'));
          console.log('Packaged',codes.length,'real SVG country flags for offline play');
          NODE
          test -s buzzer-arena/app/src/main/assets/flags/br.svg
          test -s buzzer-arena/app/src/main/assets/flags/eg.svg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android APK
        run: gradle -p buzzer-arena :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Men-Demaghak-v14-APK
          path: buzzer-arena/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Men-Demaghak-v14-unsigned-AAB
          path: buzzer-arena/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp buzzer-arena/app/build/outputs/apk/debug/app-debug.apk Men-Demaghak-v14.apk
          gh release delete men-demaghak-v14 --yes 2>/dev/null || true
          gh release create men-demaghak-v14 Men-Demaghak-v14.apk --title "من دماغك 14.0 — إرشادات تفاعلية لأول مرة" --notes "Turn-based Arabic quiz with no buzzer. Players alternate questions; typed correct +2, wrong -1; choices correct +1, wrong -2; a single steal chance for the next player after a wrong answer. First to reach ten points wins regardless of question count. Six-digit online rooms, local Bluetooth, optional computer rival, and previous duel history are retained. First-time players get a four-step home walkthrough, contextual hints on their own turns, and a replay control; each guide persists per device and never pauses the online match. Test APK is a developer debug build; the generated AAB is unsigned and must be signed with the user-owned upload key before Play submission."
