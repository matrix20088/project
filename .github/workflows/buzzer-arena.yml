name: Build Jars Al Tahaddi APK
on:
  push:
    branches: [buzzer-arena-2026]
    paths:
      - 'buzzer-arena/**'
      - '.github/workflows/buzzer-arena.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify two, three, four human modes and referee logic
        run: node buzzer-arena/tests/game.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK
        run: gradle -p buzzer-arena :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Jars-Al-Tahaddi-v5-APK
          path: buzzer-arena/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp buzzer-arena/app/build/outputs/apk/debug/app-debug.apk Jars-Al-Tahaddi-v5.apk
          gh release delete buzzer-arena-v5 --yes 2>/dev/null || true
          gh release create buzzer-arena-v5 Jars-Al-Tahaddi-v5.apk --title "جرس التحدي 5.0 — الاختيارات قبل الجرس" --notes "Android game show for 2-4 real human players; 1200+ original Arabic questions with cinema, Egyptian movie references and music; adaptive score-based difficulty, shared options on buzz, automatic retry after wrong/timeout, mandatory next question after two wrong options, host skip/guest skip request, native metallic double-bell on accepted buzz, all choices progressively shown to every player before the first surprise buzzer within 10 seconds of the fourth choice, with Arabic voice referee. Install the same APK on all paired devices. Voice needs an Arabic TTS language pack."
