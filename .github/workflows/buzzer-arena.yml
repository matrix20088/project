name: Build Jars Al Tahaddi APK
on:
  push:
    branches: [buzzer-arena-2026]
    paths:
      - 'buzzer-arena/**'
      - '.github/workflows/buzzer-arena.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify two, three, four human modes and referee logic
        run: node buzzer-arena/tests/game.test.cjs
      - name: Bundle real flag SVG pictures for offline Android play (flag-icons MIT)
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v7.3.2 https://github.com/lipis/flag-icons.git /tmp/buzzer-flag-icons
          mkdir -p buzzer-arena/app/src/main/assets/flags
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),path=require('path');
          const dir='buzzer-arena/app/src/main/assets';
          const ctx={};vm.createContext(ctx);
          for(const f of ['questions.js','extra_questions.js','hard_questions.js','movie_music_levels.js','flag_questions.js']){
            vm.runInContext(fs.readFileSync(path.join(dir,f),'utf8'),ctx,{filename:f});
          }
          const codes=[...new Set(vm.runInContext('Object.values(FLAG_QUESTION_IMAGES)',ctx))];
          for(const code of codes){
            if(!/^[a-z]{2}$/.test(code))throw Error('Invalid flag code: '+code);
            const src=path.join('/tmp/buzzer-flag-icons/flags/4x3',code+'.svg');
            if(!fs.existsSync(src))throw Error('Missing upstream flag '+src);
            fs.copyFileSync(src,path.join(dir,'flags',code+'.svg'));
          }
          fs.copyFileSync('/tmp/buzzer-flag-icons/LICENSE',path.join(dir,'flags','LICENSE'));
          console.log('Packaged',codes.length,'real SVG country flags for offline play');
          NODE
          test -s buzzer-arena/app/src/main/assets/flags/br.svg
          test -s buzzer-arena/app/src/main/assets/flags/eg.svg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK
        run: gradle -p buzzer-arena :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Jars-Al-Tahaddi-v9-APK
          path: buzzer-arena/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp buzzer-arena/app/build/outputs/apk/debug/app-debug.apk Jars-Al-Tahaddi-v9.apk
          gh release delete buzzer-arena-v9 --yes 2>/dev/null || true
          gh release create buzzer-arena-v9 Jars-Al-Tahaddi-v9.apk --title "جرس التحدي 9.0 — حكم كوميدي ونشرة السكور وخمن المكان" --notes "Android game show for 2-4 real human players; 1200+ original Arabic questions with cinema, Egyptian movie references and music; adaptive score-based difficulty, shared options on buzz, automatic retry after wrong/timeout, mandatory next question after two wrong options, host skip/guest skip request, native metallic double-bell on accepted buzz, early buzz after 1-3 spoken answers: select any spoken answer OR type a new one; before the first spoken answer type only, after all four select normally; no hidden options are selectable over Bluetooth and the fast-buzz double penalty remains; late buzz after all spoken options retains multiple choice. Includes real offline SVG picture flags, no flag answer spoken by the referee. Original locally synthesized bell and 1420+ quiz questions; 122 new offline guess-the-country / city / landmark clue questions; referee reads complete scoreboard every 3 rounds and once near victory, with playful situational one-liners and nonrepeating variation; expressive original synthetic TTS moods. Install the same APK on all paired devices. Voice needs an Arabic TTS language pack."
