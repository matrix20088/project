name: Realistic Neon Vow Android Visual Prototype
on:
  push:
    branches: [neon-vow-3d-realism-2026]
    paths:
      - 'neon-vow-realism/**'
      - '.github/workflows/neon-vow-realism.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Blender and download licensed test scans
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy >/dev/null
          mkdir -p neon-vow-realism/raw neon-vow-realism/app/src/main/assets/models
          for person in nathan sophia; do
            curl -fL --retry 3 "https://raw.githubusercontent.com/s0ck3t/VideoIntoBlenderModel/main/assets/rigs/renderpeople_${person}.fbx" -o "neon-vow-realism/raw/${person}.fbx"
            curl -fL --retry 3 "https://raw.githubusercontent.com/s0ck3t/VideoIntoBlenderModel/main/assets/rigs/renderpeople_${person}.png" -o "neon-vow-realism/raw/${person}.png"
            blender -b --python neon-vow-realism/scripts/convert_character.py -- "${person}" "neon-vow-realism/raw/${person}.fbx" "neon-vow-realism/raw/${person}.png" "neon-vow-realism/app/src/main/assets/models/${person}.glb"
            test -s "neon-vow-realism/app/src/main/assets/models/${person}.glb"
            test -s "neon-vow-realism/app/src/main/assets/models/${person}.glb"
          done
          ls -lh neon-vow-realism/app/src/main/assets/models/
      - name: Bundle Three.js scene and screenshot tools
        working-directory: neon-vow-realism
        run: |
          npm install --no-save three@0.181.2 esbuild@0.25.12 puppeteer-core@24.31.0
          npx esbuild src/main.js --bundle --format=iife --minify --target=es2020 --outfile=app/src/main/assets/game.js
      - name: Capture real-time WebGL renders
        run: node neon-vow-realism/scripts/capture.cjs
      - name: Upload scene proof
        uses: actions/upload-artifact@v4
        with:
          name: NeonVow-Real3D-Screens
          path: neon-vow-realism/previews/*.png
          if-no-files-found: error
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK from same 3D code
        run: gradle -p neon-vow-realism :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NeonVow-Real3D-APK
          path: neon-vow-realism/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK and unedited screenshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp neon-vow-realism/app/build/outputs/apk/debug/app-debug.apk NeonVow-Real3D.apk
          gh release delete neon-vow-realism-v1 --yes 2>/dev/null || true
          gh release create neon-vow-realism-v1 NeonVow-Real3D.apk neon-vow-realism/previews/*.png --title "NEON VOW — real 3D rendering test (not final game)" --notes "Android vertical slice with real scanned characters and same Three.js scene used to generate the included unedited screenshots. Not a finished AAA game. Android hardware tests still required."
