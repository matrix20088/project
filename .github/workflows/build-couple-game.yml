name: Build Escape Together APK
on:
  push:
    branches: [couple-game-apk-2026]
    paths:
      - 'couple-game/**'
      - '.github/workflows/build-couple-game.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p couple-game :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ElHoroobSawa-v3-APK
          path: couple-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp couple-game/app/build/outputs/apk/debug/app-debug.apk ElHoroobSawa-2.0.apk
          gh release delete couple-game-v3 --yes 2>/dev/null || true
          gh release create couple-game-v3 ElHoroobSawa-v2.apk --title "الهروب سوا 2.0 — مغامرات الكبار" --notes "120 مهمة، 12 عالَم، 4 تحديات في كل مهمة، ومود رومانسي وجريء بالتراضي. ثبّت نفس APK على الجهازين."
