name: NEON VOW Co-op 3D Gameplay and Android APK
on:
  push:
    branches: [neon-vow-coop-game-v2]
    paths:
      - 'neon-vow-realism/**'
      - '.github/workflows/neon-vow-coop-game.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game rules and mission completion
        run: node neon-vow-realism/scripts/test-game.mjs
      - name: Install Blender and convert detailed 3D character assets
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy >/dev/null
          mkdir -p neon-vow-realism/raw neon-vow-realism/app/src/main/assets/models
          for person in nathan sophia; do
            curl -fL --retry 3 "https://raw.githubusercontent.com/s0ck3t/VideoIntoBlenderModel/main/assets/rigs/renderpeople_${person}.fbx" -o "neon-vow-realism/raw/${person}.fbx"
            curl -fL --retry 3 "https://raw.githubusercontent.com/s0ck3t/VideoIntoBlenderModel/main/assets/rigs/renderpeople_${person}.png" -o "neon-vow-realism/raw/${person}.png"
            blender -b --python neon-vow-realism/scripts/convert_character.py -- "${person}" "neon-vow-realism/raw/${person}.fbx" "neon-vow-realism/raw/${person}.png" "neon-vow-realism/app/src/main/assets/models/${person}.glb"
            test -s "neon-vow-realism/app/src/main/assets/models/${person}.glb"
          done
      - name: Bundle real-time 3D game
        working-directory: neon-vow-realism
        run: |
          npm install --no-save three@0.181.2 esbuild@0.25.12 puppeteer-core@24.31.0
          npx esbuild src/play.mjs --bundle --format=iife --minify --target=es2020 --outfile=app/src/main/assets/game.js
          test -s app/src/main/assets/game.js
      - name: Run gameplay in headless Chromium and capture screenshots
        run: node neon-vow-realism/scripts/capture-game.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: NeonVow-Coop-RealGameplay-Screens
          path: neon-vow-realism/previews/*.png
          if-no-files-found: error
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile APK and verify included game assets
        run: |
          gradle -p neon-vow-realism :app:assembleDebug --no-daemon
          unzip -l neon-vow-realism/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/models/nathan.glb'
          unzip -l neon-vow-realism/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/models/sophia.glb'
          unzip -l neon-vow-realism/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/game.js'
      - uses: actions/upload-artifact@v4
        with:
          name: NeonVow-Coop-3D-APK
          path: neon-vow-realism/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android APK and real screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp neon-vow-realism/app/build/outputs/apk/debug/app-debug.apk NeonVow-Coop-3D.apk
          gh release delete neon-vow-coop-v2 --yes 2>/dev/null || true
          gh release create neon-vow-coop-v2 NeonVow-Coop-3D.apk neon-vow-realism/previews/*.png --title "NEON VOW 3D — cooperative combat prototype" --notes "Playable third-person 3D Android prototype. 12 missions, 3 sectors per mission, realistic scanned character models, dash, sword, ranged magic, EMP, enemy AI, bosses, co-op gates, rescue, Bluetooth Classic 2-phone mode, offline solo companion. Screenshots are real unedited WebGL captures. Android physical-device and Bluetooth pairing performance require testing. Not AAA final game."